name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies (includes the SUMO simulator)
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Rebuild the data files and pages (fails if the export or build breaks)
        run: |
          python -m qgw.export
          python web/build_single.py
          git diff --stat -- web/site/site-data.js web/data.js
